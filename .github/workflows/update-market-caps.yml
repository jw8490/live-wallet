name: Update market caps

on:
  schedule:
    # Every 30 min on weekdays, 13:00–21:30 UTC (covers 9:30am–4pm New York in both EDT and EST)
    - cron: "*/30 13-21 * * 1-5"
    # Daily after the US close (and on weekends, to pick up private-valuation config edits)
    - cron: "20 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/ecosystem.json"
      - "scripts/update-market-caps.mjs"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-market-caps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No API key needed: Nasdaq quote API (market cap) + Yahoo Finance chart API (price, daily change).
      - name: Fetch market data
        run: node scripts/update-market-caps.mjs

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-caps.json index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            git commit -m "data: refresh market caps $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN may not trigger a branch-based Pages rebuild on their own,
      # so request one explicitly. (The page also reads raw.githubusercontent.com as a fallback.)
      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
